name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues, email security@brimble.app instead — do not open a public issue.
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Short, clear description of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      placeholder: Expected X, got Y
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v1.2.3 or commit SHA
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, browser/CLI version, runtime
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact all secrets (API keys, tokens, passwords).
      render: text
    validations:
      required: false
